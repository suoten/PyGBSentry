version: '3.8'

services:
  db:
    # DEVOPS: postgres:14 存在已知 CVE，升级到 16-alpine（PG 16 长期支持，安全补丁最新）
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Please set POSTGRES_PASSWORD in .env or environment variable}  # FIXED: i18n - replaced hardcoded Chinese with English
      POSTGRES_DB: pygb28181
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # FIXED-P2: W-08 移除PG端口对外暴露，仅容器内网可达，防止未授权访问
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - backend
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    # DEVOPS: redis:6 存在已知 CVE，升级到 7-alpine（Redis 7 安全补丁最新，ACL/功能增强）
    image: redis:7-alpine
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD:?Please set REDIS_PASSWORD in .env or environment variable}  # FIXED: i18n - replaced hardcoded Chinese with English
    volumes:
      - redis_data:/data
    # FIXED-P2: W-08 移除Redis端口对外暴露，仅容器内网可达，防止未授权访问
    expose:
      - "6379"
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$$REDIS_PASSWORD redis-cli ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - backend
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    build: ./backend
    restart: always
    environment:
      APP_ENV: ${APP_ENV:-prod}
      APP_EDITION: ${APP_EDITION:-oss}
      POSTGRES_SERVER: db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Please set POSTGRES_PASSWORD in .env or environment variable}  # FIXED: i18n - replaced hardcoded Chinese with English
      POSTGRES_DB: pygb28181
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Please set REDIS_PASSWORD in .env or environment variable}  # FIXED: i18n - replaced hardcoded Chinese with English
      INIT_REDIS_ON_STARTUP: "true"
      SIP_IP: ${SIP_IP:-0.0.0.0}
      # ⚠️ 必填项：生产环境安全密钥
      SECRET_KEY: ${SECRET_KEY:?Please set SECRET_KEY in .env or environment variable}  # FIXED: i18n - replaced hardcoded Chinese with English
      MEDIA_SERVER_SECRET: ${MEDIA_SERVER_SECRET:?Please set MEDIA_SERVER_SECRET in .env or environment variable}  # FIXED: i18n - replaced hardcoded Chinese with English
      # ⚠️ Docker 部署时必须设为容器网络可达的 IP（如宿主机 IP），否则 ZLM Hook 不可达
      BACKEND_PUBLIC_HOST: ${BACKEND_PUBLIC_HOST:?Please set BACKEND_PUBLIC_HOST in .env or environment variable (localhost not available in Docker)}  # FIXED: i18n - replaced hardcoded Chinese with English
      RUNNING_IN_DOCKER: "true"
      RTP_PORT_RANGE_START: ${RTP_PORT_RANGE_START:-30000}
      RTP_PORT_RANGE_END: ${RTP_PORT_RANGE_END:-30999}
      DOCKER_RTP_PORT_RANGE_MAX: ${DOCKER_RTP_PORT_RANGE_MAX:-1000}
      SIP_STATE_BACKEND: ${SIP_STATE_BACKEND:-redis}
      # FIXED-P0: SIP_DEFAULT_PASSWORD 生产环境必填，空密码导致 SystemExit(1)
      SIP_DEFAULT_PASSWORD: ${SIP_DEFAULT_PASSWORD:?Please set SIP_DEFAULT_PASSWORD in .env or environment variable}
      # ZLM 端口配置（须与端口映射一致）
      MEDIA_SERVER_HTTP_PORT: ${MEDIA_SERVER_HTTP_PORT:-8880}
      MEDIA_SERVER_RTSP_PORT: ${MEDIA_SERVER_RTSP_PORT:-554}
      MEDIA_SERVER_RTMP_PORT: ${MEDIA_SERVER_RTMP_PORT:-1935}
      MEDIA_SERVER_RTP_PROXY_PORT_RANGE: ${MEDIA_SERVER_RTP_PROXY_PORT_RANGE:-30000-30999}
      BACKEND_PUBLIC_PORT: ${BACKEND_PUBLIC_PORT:-8000}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-120}  # FIXED-P2: 与 config.py 默认值 120 对齐
      SIP_DEBUG_TRACE_ENABLED: "false"
      ENABLE_OPENAPI_DOCS: ${ENABLE_OPENAPI_DOCS:-false}
      TRIAL_DAYS: ${TRIAL_DAYS:-7}
      # FIXED: CORS configuration for cross-origin access
      BACKEND_CORS_ORIGINS: ${BACKEND_CORS_ORIGINS:-["http://localhost","http://localhost:80"]}
    ports:
      - "8000:8000"           # 后端 API
      - "5060:5060/udp"       # SIP UDP
      - "5060:5060/tcp"       # SIP TCP
      - "5061:5061/tcp"       # SIP TLS
      # RTP 端口范围（须与 MEDIA_SERVER_RTP_PROXY_PORT_RANGE 和 Dockerfile EXPOSE 一致）
      # ⚠️ 如修改此范围，须同步修改 Dockerfile 中的 EXPOSE 和 MEDIA_SERVER_RTP_PROXY_PORT_RANGE
      - "${RTP_PORT_RANGE_START:-30000}-${RTP_PORT_RANGE_END:-30999}:${RTP_PORT_RANGE_START:-30000}-${RTP_PORT_RANGE_END:-30999}/udp"
      - "8880:8880"           # ZLM HTTP
      - "1935:1935"           # ZLM RTMP
      - "554:554"             # ZLM RTSP
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    # FIXED-P2: 添加backend健康检查，容器编排探针可感知实际状态
    # FIXED D-05: 统一健康检查端点为 /api/v1/health/
    healthcheck:
      # FIXED: [2026-07-10] D-02 健康检查改用 curl -f（Dockerfile 已安装 curl），urllib 默认无超时控制可能挂满 healthcheck [全栈工程师]
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    volumes:
      - backend_data:/app/data
      - backend_logs:/app/logs
      - backend_records:/app/records
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    networks:
      - backend
      - frontend
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  frontend:
    build: ./frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
    # FIXED P1-37: 使用 wget 替代 curl（nginx:stable-alpine 镜像自带 wget，无 curl）
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M
    networks:
      - frontend
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres_data:
  redis_data:
  backend_data:
  backend_logs:
  backend_records:

networks:
  backend:
    driver: bridge
    internal: false
  frontend:
    driver: bridge
