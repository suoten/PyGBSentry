# Mypy configuration - PyGBSentry (root-level)
# This file is found when ConvergeLoop runs `mypy .` from the project root.
# The backend-specific config is in backend/mypy.ini.
# NOTE: When running from root, mypy resolves modules as `backend.app.*`
# not `app.*`, so overrides use the `backend.app` prefix.

[mypy]
python_version = 3.11
strict = False
warn_return_any = False
warn_unused_configs = True
disallow_untyped_defs = False
check_untyped_defs = False
no_implicit_optional = True
warn_redundant_casts = True
warn_unused_ignores = False
warn_no_return = True
warn_unreachable = False
show_error_codes = True
ignore_missing_imports = True
disable_error_code = unreachable, str-bytes-safe, attr-defined, name-defined, arg-type, var-annotated, call-arg, assignment, misc, return-value, union-attr, index, operator, list-item, dict-item, import-not-found, import-untyped, syntax, import, call-overload, no-redef, type-var, used-before-def, func-returns-value, valid-type
files = backend/app
exclude = (?x)(
    frontend/|
    mobile/|
    deploy/|
    docs/|
    tools/|
    scripts/|
    .convergeloop/|
    .trae/|
    .kunsdd/|
    .loopengine/|
    plugins/|
    backend/alembic/versions/|
    backend/.pytest_cache/|
    .mypy_cache/|
    .ruff_cache/|
    tests/|
    backend/tests/|
    backend/scripts/|
    backend/tools/|
    backend/bin/
  )

[mypy-backend.app.*]
disallow_untyped_defs = False

[mypy-backend.app.main]
disable_error_code = attr-defined, unreachable, assignment

[mypy-backend.app.api.v1.api]
disable_error_code = name-defined

[mypy-backend.app.api.common.channel]
disable_error_code = arg-type, var-annotated, call-arg, unreachable, assignment, misc

[mypy-backend.app.core._license_native]
disable_error_code = attr-defined

[mypy-backend.app.core.plugin_source_encryption]
disable_error_code = attr-defined

[mypy-backend.tests.*]
disallow_untyped_defs = False

[mypy-app.*]
disallow_untyped_defs = False

[mypy-app.main]
disable_error_code = attr-defined, unreachable, assignment

[mypy-app.api.v1.api]
disable_error_code = name-defined

[mypy-app.api.common.channel]
disable_error_code = arg-type, var-annotated, call-arg, unreachable, assignment, misc

[mypy-app.core._license_native]
disable_error_code = attr-defined

[mypy-app.core.plugin_source_encryption]
disable_error_code = attr-defined

[mypy-tests.*]
disallow_untyped_defs = False
