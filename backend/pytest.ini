# Pytest configuration — PyGBSentry backend
# This file ensures pytest is detected as the test framework by IDE integrations
# and CI/CD pipelines. The comprehensive configuration is in pyproject.toml.

[pytest]
minversion = 7.0
testpaths = tests
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
# 覆盖率门槛：实测 23.73% - 2% 安全余量 = 21（工业级基线，随测试补充逐步上调）
# P-DEVOPS: 添加 HTML 覆盖率报告输出，便于 CI/CD 产物归档和开发者本地查看
addopts = -v --tb=short --strict-markers --cov=app --cov-report=term-missing --cov-report=html:htmlcov --cov-fail-under=21
