# Mypy configuration - PyGBSentry backend
# Ensures mypy is detected by IDE integrations and CI/CD pipelines.
# Comprehensive configuration is in pyproject.toml [tool.mypy] section.

[mypy]
python_version = 3.11
strict = False
warn_return_any = False
warn_unused_configs = True
disallow_untyped_defs = False
check_untyped_defs = True
no_implicit_optional = True
warn_redundant_casts = True
warn_unused_ignores = True
warn_no_return = True
warn_unreachable = False
show_error_codes = True
ignore_missing_imports = True
disable_error_code = unreachable, str-bytes-safe
exclude = (?x)(
    frontend/|
    mobile/|
    deploy/|
    docs/|
    tools/|
    alembic/versions/|
    .pytest_cache/
  )

[mypy-app.*]
disallow_untyped_defs = False

[mypy-app.main]
disable_error_code = attr-defined, unreachable, assignment

[mypy-app.api.v1.api]
disable_error_code = name-defined

[mypy-app.api.common.channel]
disable_error_code = arg-type, var-annotated, call-arg, unreachable, assignment, misc

[mypy-app.core._license_native]
disable_error_code = attr-defined

[mypy-app.core.plugin_source_encryption]
disable_error_code = attr-defined

[mypy-tests.*]
disallow_untyped_defs = False
