# PyGBSentry Pre-commit Configuration
# Install: pip install pre-commit && pre-commit install
# Run manually: pre-commit run --all-files

repos:
  # Basic checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-toml
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: check-merge-conflict
        args: [--assume-in-merge]
      - id: check-case-conflict
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: detect-private-key
      - id: destroyed-symlinks
      - id: check-json
      - id: pretty-format-json
        args: [--autofix, --no-sort-keys]
      - id: detect-aws-credentials
        args: [--allow-multiple-credentials]
      - id: check-ast
      - id: check-docstring-first

  # Ruff linter
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.4.0
    hooks:
      - id: ruff
        name: ruff-check
        args: [--fix, --exit-non-zero-on-fix]
        types_or: [python, pyi]
      - id: ruff-format
        name: ruff-format
        args: [--check, --diff]
        types_or: [python, pyi]

  # Python security
  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.6
    hooks:
      - id: bandit
        name: bandit-scan
        args: [-r, app/, -f, json, -o, bandit_report.json, --severity-level=medium]
        pass_filenames: false

  # Type checking (optional, can be slow)
  - repo: local
    hooks:
      - id: mypy-check
        name: mypy-type-check
        entry: python -m mypy app/ --ignore-missing-imports --no-error-summary
        language: system
        pass_filenames: false
        types: [python]
        stages: [manual]

  # Poetry lock file validation
  - repo: https://github.com/python-poetry/pre-commit-hooks
    rev: v0.6.0
    hooks:
      - id: check-toml
      - id: check-yaml
        args: [--allow-multiple-documents]

ci:
  autoupdate_schedule: monthly
  skip: []
  require_serial: false
  fail_fast: false
