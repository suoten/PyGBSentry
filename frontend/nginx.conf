# PyGBSentry Nginx Configuration
# 部署时通过环境变量替换域名：
#   sed -i "s/YOUR_DOMAIN/your-domain.com/g" nginx.conf
# 或在 docker-compose.yml 中使用 envsubst 模板化
#
# P0-9: 两种部署模式
#   开发模式（HTTP）：保留下方 HTTP server 块，注释 HTTPS 块
#   生产模式（HTTPS）：注释 HTTP server 块的 location /，启用 HTTPS server 块 + HTTP→HTTPS 跳转块
#   生产模式必须配置 SSL 证书（见 deploy/scripts/setup-ssl-certbot.sh）

# ==============================================================================
# HTTP server — 开发模式 / certbot 验证
# ==============================================================================
server {
    listen 80;
    server_name YOUR_DOMAIN;

    # Let's Encrypt 证书验证
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # P0-9: 生产模式启用 HTTPS 时，取消下面注释将 HTTP 301 跳转到 HTTPS
    # location / {
    #     return 301 https://$host$request_uri;
    # }

    # 开发模式：HTTP 直接提供服务（生产模式请注释此块并启用上方 301 跳转）
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;

        # P0-8: CSP — script-src 暂保留 unsafe-inline（Jessibuca/H265 播放器限制）
        # TODO: 为 Jessibuca/OpenLayers 适配 nonce/hash 后移除 unsafe-inline
        # FIX: [2026-07-10] connect-src 移除通配 ws:/wss:（违反安全约束），
        # nginx 代理所有媒体流量（/live/ /rtp/ /index/api/）为同源，'self' 足够。
        # 如部署使用独立 ZLM 公网域名，需在此添加 wss://STREAM_HOST（envsubst 模板化）。
        # [全栈工程师]
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; connect-src 'self'; frame-ancestors 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; media-src 'self' blob:; frame-src 'self'; worker-src 'self' blob:;" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "credentialless" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
    }

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600;
    }

    location ^~ /live/ {
        proxy_pass http://backend:8880;
        proxy_http_version 1.1;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_request_buffering off;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;
    }

    location ^~ /rtp/ {
        proxy_pass http://backend:8880;
        proxy_http_version 1.1;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_intercept_errors off;
        proxy_read_timeout 3600;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;
    }

    location ^~ /index/api/ {
        proxy_pass http://backend:8880;
        proxy_http_version 1.1;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /record/ {
        proxy_pass http://backend:8880/record/;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}

# ==============================================================================
# HTTPS server — 生产模式（P0-9）
# 启用方式：配置 SSL 证书路径后取消注释此块
# ==============================================================================
server {
    listen 443 ssl http2;
    server_name YOUR_DOMAIN;

    ssl_certificate /etc/letsencrypt/live/YOUR_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # P0-9: HSTS — 强制 HTTPS
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;

    # P0-8: CSP — script-src 暂保留 unsafe-inline（Jessibuca/H265 播放器限制）
    # TODO: 为 Jessibuca/OpenLayers 适配 nonce/hash 后移除 unsafe-inline
    # FIX: [2026-07-10] connect-src 移除通配 ws:/wss:（同上 HTTP 块修复） [全栈工程师]
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; connect-src 'self'; frame-ancestors 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; media-src 'self' blob:; frame-src 'self'; worker-src 'self' blob:;" always;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600;
    }

    location ^~ /live/ {
        proxy_pass http://backend:8880;
        proxy_http_version 1.1;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_request_buffering off;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;
    }

    location ^~ /rtp/ {
        proxy_pass http://backend:8880;
        proxy_http_version 1.1;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_intercept_errors off;
        proxy_read_timeout 3600;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;
    }

    location ^~ /index/api/ {
        proxy_pass http://backend:8880;
        proxy_http_version 1.1;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /record/ {
        proxy_pass http://backend:8880/record/;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
