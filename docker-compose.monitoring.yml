# PyGBSentry Monitoring Stack
# ----------------------------
# Usage: docker compose -f docker-compose.yml -f docker-compose.monitoring.yml up -d
#
# This overlay adds Prometheus, Alertmanager, and Grafana to your deployment.
# Alert rules and dashboard are automatically loaded from deploy/monitoring/.

version: '3.8'

services:
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: pygbsentry-prometheus
    restart: unless-stopped
    volumes:
      - ./deploy/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/monitoring/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=30d'
      - '--storage.tsdb.retention.size=10GB'
      - '--web.enable-lifecycle'
    ports:
      - "9090:9090"
    depends_on:
      - backend

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: pygbsentry-alertmanager
    restart: unless-stopped
    volumes:
      - ./deploy/monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    ports:
      - "9093:9093"

  grafana:
    image: grafana/grafana:10.4.0
    container_name: pygbsentry-grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD must be set}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=${GRAFANA_ROOT_URL:-http://localhost:3000}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./deploy/monitoring/grafana_dashboard.json:/var/lib/grafana/dashboards/pygbsentry.json:ro
      - ./deploy/monitoring/grafana_dashboard_provider.yml:/etc/grafana/provisioning/dashboards/provider.yml:ro
      - ./deploy/monitoring/grafana_datasource.yml:/etc/grafana/provisioning/datasources/datasource.yml:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

  node-exporter:
    image: prom/node-exporter:v1.7.0
    container_name: pygbsentry-node-exporter
    restart: unless-stopped
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
    ports:
      - "9100:9100"

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: pygbsentry-postgres-exporter
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: "postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/pygb28181?sslmode=disable"
    ports:
      - "9187:9187"
    depends_on:
      - db

  redis-exporter:
    image: oliver006/redis_exporter:v1.61.0
    container_name: pygbsentry-redis-exporter
    restart: unless-stopped
    environment:
      REDIS_ADDR: "redis:6379"
      REDIS_PASSWORD: "${REDIS_PASSWORD:-}"
    ports:
      - "9121:9121"
    depends_on:
      - redis

  loki:
    image: grafana/loki:2.9.6
    container_name: pygbsentry-loki
    restart: unless-stopped
    volumes:
      - ./deploy/monitoring/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml

  promtail:
    image: grafana/promtail:2.9.6
    container_name: pygbsentry-promtail
    restart: unless-stopped
    volumes:
      - ./deploy/monitoring/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki

volumes:
  prometheus_data:
  alertmanager_data:
  grafana_data:
  loki_data:
