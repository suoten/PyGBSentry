{{- if not .Values.backend.env.POSTGRES_PASSWORD }}
{{- fail "backend.env.POSTGRES_PASSWORD is required. Set it with --set backend.env.POSTGRES_PASSWORD=YOUR_PASSWORD" }}
{{- end }}
{{- if not .Values.backend.env.REDIS_PASSWORD }}
{{- fail "backend.env.REDIS_PASSWORD is required. Set it with --set backend.env.REDIS_PASSWORD=YOUR_PASSWORD" }}
{{- end }}
{{- if not .Values.backend.env.SECRET_KEY }}
{{- fail "backend.env.SECRET_KEY is required. Set it with --set backend.env.SECRET_KEY=YOUR_SECRET_KEY (32+ chars)" }}
{{- end }}
{{- if not .Values.backend.env.BACKEND_PUBLIC_HOST }}
{{- fail "backend.env.BACKEND_PUBLIC_HOST is required. Set it with --set backend.env.BACKEND_PUBLIC_HOST=YOUR_PUBLIC_HOST" }}
{{- end }}
{{- if .Values.postgresql.enabled }}
{{- if not .Values.postgresql.auth.postgresPassword }}
{{- fail "postgresql.auth.postgresPassword is required when postgresql.enabled=true. Set it with --set postgresql.auth.postgresPassword=YOUR_PASSWORD" }}
{{- end }}
{{- end }}
