apiVersion: v1
kind: Service
metadata:
  name: {{ include "pygbsentry.fullname" . }}-backend
  labels:
    {{- include "pygbsentry.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  type: {{ .Values.backend.service.type }}
  ports:
    - name: http
      port: {{ .Values.backend.service.port }}
      targetPort: http
    {{- if .Values.backend.sipUdp.enabled }}
    - name: sip-udp
      port: {{ .Values.backend.sipUdp.port }}
      targetPort: sip-udp
      protocol: UDP
    {{- end }}
    {{- if .Values.backend.sipTcp.enabled }}
    - name: sip-tcp
      port: {{ .Values.backend.sipTcp.port }}
      targetPort: sip-tcp
      protocol: TCP
    {{- end }}
    {{- if .Values.backend.sipTls.enabled }}
    - name: sip-tls
      port: {{ .Values.backend.sipTls.port }}
      targetPort: sip-tls
      protocol: TCP
    {{- end }}
    # FIXED-P1: N-13 RTP 媒体流量使用端口范围(如30000-30099)，K8s Service 不支持端口范围。
    # 当 backend.hostNetwork=true 时，Pod 直接使用宿主机网络，RTP 端口无需通过 Service 暴露。
    # 如果不需要 hostNetwork，则需要为每个 RTP 端口单独创建 Service 条目或使用 headless Service + StatefulSet。
    {{- if and .Values.backend.rtp.enabled (not .Values.backend.hostNetwork) }}
    - name: rtp
      port: {{ .Values.backend.rtp.portRangeStart }}
      targetPort: rtp
      protocol: UDP
    {{- end }}
    - name: zlm-http
      port: {{ .Values.backend.zlm.httpPort }}
      targetPort: zlm-http
    - name: rtsp
      port: {{ .Values.backend.zlm.rtspPort }}
      targetPort: rtsp
    - name: rtmp
      port: {{ .Values.backend.zlm.rtmpPort }}
      targetPort: rtmp
  selector:
    {{- include "pygbsentry.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: backend
