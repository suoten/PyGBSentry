# PyGBSentry Nginx Load Balancer + TLS Termination
# -------------------------------------------------
# Place in /etc/nginx/conf.d/ or mount as Docker volume.

upstream pygbsentry_backend {
    # For single instance:
    server backend:8000;
    # For HA (docker-compose.ha.yml), add multiple backends:
    # server backend-1:8000;
    # server backend-2:8000;
    keepalive 32;
}

server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name _;

    # --- TLS Configuration ---
    ssl_certificate     /etc/nginx/ssl/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # --- Security Headers ---
    # FIX: [2026-07-16 P1] 移除 nginx 层的 X-Frame-Options，由后端 SecurityHeadersMiddleware 统一控制（DENY）。
    # 原配置 nginx 追加 SAMEORIGIN + 后端设置 DENY → 浏览器收到两个冲突头部。
    add_header X-Content-Type-Options nosniff always;
    # FIX: [2026-07-16 P1] 移除已废弃的 X-XSS-Protection（OWASP 2018 起废弃），
    # 现代浏览器已移除 XSS Auditor，mode=block 在旧浏览器中可引入信息泄漏。依赖 CSP 防护 XSS。
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # --- API Proxy (HTTP + WebSocket) ---
    # FIX: [2026-07-18 P0] 所有 WebSocket 端点都在 /api/v1/ 路径下
    # (alarms/ws, logs/ws/logs, ws/sip-trace, talk/ws/talk/{id})，
    # 必须在 /api/ location 中添加 WebSocket upgrade 头，否则握手失败。
    # 原配置将 WebSocket 头放在独立的 /ws/ location，但该路径无法匹配
    # 任何实际 WebSocket 端点（均以 /api/ 开头），导致全部 WS 连接失败。
    location /api/ {
        proxy_pass http://pygbsentry_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket upgrade — 对普通 HTTP 请求无副作用（仅在客户端发送
        # Upgrade: websocket 时生效），因此可安全地在 /api/ 中共用。
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # 长连接超时：HTTP API 300s 足够，WebSocket 需要 3600s 防止 nginx 主动断开。
        proxy_read_timeout 3600s;
        proxy_send_timeout 300s;
    }

    # --- Metrics (restrict access) ---
    location /metrics {
        proxy_pass http://pygbsentry_backend;
        proxy_set_header Host $host;
        # Allow only internal networks
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        allow 127.0.0.1;
        allow ::1;
        deny all;
        # FIX: [2026-07-16 P2] Prometheus 每 15s 抓取一次会产生大量日志
        access_log off;
    }

    # --- Health Probes ---
    location /health/ {
        proxy_pass http://pygbsentry_backend;
        proxy_set_header Host $host;
        access_log off;
    }

    # --- Frontend ---
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

upstream pygbsentry_frontend {
    server frontend:80;
    keepalive 16;
}
