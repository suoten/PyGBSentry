# Grafana DataSource Provisioning Configuration
# -----------------------------------------------
# Place this file in Grafana's provisioning/datasources/ directory
# to auto-configure the Prometheus and Loki data sources.

apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true
    jsonData:
      timeInterval: '15s'

  - name: Loki
    type: loki
    access: proxy
    url: http://loki:3100
    editable: true
    jsonData:
      maxLines: 1000
