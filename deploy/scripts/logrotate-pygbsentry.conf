# P1-35: logrotate config for PyGBSentry (systemd deployment)
#
# Install to /etc/logrotate.d/pygbsentry (deploy/install.sh setup_logrotate()
# does this automatically when /etc/logrotate.d exists).
#
# Rotates the app.log and audit.log produced by the backend (see
# backend/app/main.py: logger -> <LOG_DIR>/app.log, HashChainSink ->
# <LOG_DIR>/audit.log). The container/host LOG_DIR defaults to /app/logs.
#
# copytruncate is used so the running process keeps its open file handle
# without needing a signal/reopen; this is safe for loguru's file sinks.
#
# Verification (dry run):
#   sudo logrotate -d /etc/logrotate.d/pygbsentry
# Force a rotation now:
#   sudo logrotate -f /etc/logrotate.d/pygbsentry

/app/logs/*.log {
    daily
    rotate 30
    compress
    delaycompress
    missingok
    notifempty
    copytruncate
    size 50M
}
