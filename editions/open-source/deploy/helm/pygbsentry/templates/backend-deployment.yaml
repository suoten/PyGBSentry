apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "pygbsentry.fullname" . }}-backend
  labels:
    {{- include "pygbsentry.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "pygbsentry.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: backend
  template:
    metadata:
      labels:
        {{- include "pygbsentry.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: backend
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      # FIXED-P1: N-13 当 RTP 媒体流量需要端口范围时，启用 hostNetwork 使 Pod 直接使用宿主机网络，
      # 从而绕过 K8s Service 不支持端口范围的限制。注意：启用后每个节点只能运行一个 backend Pod 副本。
      {{- if .Values.backend.hostNetwork }}
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      {{- end }}
      {{- if .Values.serviceAccount.create }}
      serviceAccountName: {{ include "pygbsentry.serviceAccountName" . }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: backend
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.backend.repository }}:{{ .Values.image.backend.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.backend.pullPolicy }}
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
            {{- if .Values.backend.sipUdp.enabled }}
            - name: sip-udp
              containerPort: {{ .Values.backend.sipUdp.port }}
              protocol: UDP
            {{- end }}
            {{- if .Values.backend.sipTcp.enabled }}
            - name: sip-tcp
              containerPort: {{ .Values.backend.sipTcp.port }}
              protocol: TCP
            {{- end }}
            {{- if .Values.backend.sipTls.enabled }}
            - name: sip-tls
              containerPort: {{ .Values.backend.sipTls.port }}
              protocol: TCP
            {{- end }}
            {{- if .Values.backend.rtp.enabled }}
            {{- $start := int .Values.backend.rtp.portRangeStart }}
            {{- $end := int .Values.backend.rtp.portRangeEnd }}
            {{- range $i := until ($end | add1 | sub $start) }}
            - name: rtp-{{ add $start $i }}
              containerPort: {{ add $start $i }}
              protocol: UDP
            {{- end }}
            {{- end }}
            - name: zlm-http
              containerPort: {{ .Values.backend.zlm.httpPort }}
              protocol: TCP
            - name: rtsp
              containerPort: {{ .Values.backend.zlm.rtspPort }}
              protocol: TCP
            - name: rtmp
              containerPort: {{ .Values.backend.zlm.rtmpPort }}
              protocol: TCP
          env:
            {{- range $key, $value := .Values.backend.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "pygbsentry.fullname" . }}-secret
                  key: POSTGRES_PASSWORD
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "pygbsentry.fullname" . }}-secret
                  key: REDIS_PASSWORD
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "pygbsentry.fullname" . }}-secret
                  key: SECRET_KEY
            - name: MEDIA_SERVER_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "pygbsentry.fullname" . }}-secret
                  key: MEDIA_SERVER_SECRET
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
          # FIXED-P4: W-24 添加 liveness 和 readiness 探针
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: data
              mountPath: /app/data
            - name: recordings
              mountPath: /app/records
            - name: logs
              mountPath: /app/logs
      volumes:
        - name: data
          {{- if .Values.persistence.backendData.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "pygbsentry.fullname" . }}-data
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: recordings
          {{- if .Values.persistence.recordings.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "pygbsentry.fullname" . }}-recordings
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: logs
          emptyDir: {}
      {{- with .Values.backend.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.backend.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.backend.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
