# P1-46: 发布工作流 — tag 推送触发，构建版本化 Docker 镜像并创建 GitHub Release
#
# 触发条件：推送 v*.*.* 格式的 tag（如 v1.0.0、v1.0.0-rc.1）
# 产物：
#   - 版本化的 Docker 镜像（ghcr.io/<owner>/<repo>:<tag> + :latest）
#   - GitHub Release（含自动生成的 changelog）
#   - 前端构建产物 artifact（供下载分发）
#
# 使用方式：
#   git tag v1.0.0
#   git push origin v1.0.0

name: Release

on:
  push:
    tags:
      - 'v*.*.*'
      - 'v*.*.*-*'  # 支持预发布版本如 v1.0.0-rc.1

permissions:
  contents: write
  packages: write
  security-events: write  # FIX: Trivy SARIF 上传 Security tab 需要此权限（原先缺失导致发布失败）

jobs:
  build-and-release:
    name: Build & Release
    runs-on: ubuntu-latest
    env:
      # secrets 无法直接在 if 中判断，映射到 env（未配置时 ACR 推送步骤自动跳过）
      ALIYUN_ACR_REGISTRY: ${{ secrets.ALIYUN_ACR_REGISTRY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 完整历史，用于生成 changelog

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable=${{ !contains(github.ref, '-') }}

      - name: Build and push versioned Docker image (backend)
        uses: docker/build-push-action@v5
        with:
          # FIX: backend/Dockerfile 的 COPY 路径按 backend/ 目录书写，上下文必须是 ./backend
          # （原为根目录，COPY requirements.txt 直接失败，release 构建必崩）
          context: ./backend
          file: backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          # FIX: 关闭 provenance 证明清单——其 OCI 空描述符(vnd.oci.empty.v1+json)
          # 不被阿里云 ACR 支持，push 时报 unknown manifest class
          provenance: false
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ steps.version.outputs.VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extract metadata for frontend image
        id: meta_frontend
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-frontend
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable=${{ !contains(github.ref, '-') }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: frontend/Dockerfile
          push: true
          tags: ${{ steps.meta_frontend.outputs.tags }}
          provenance: false
          labels: ${{ steps.meta_frontend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 国内镜像：配置以下 Repository Secrets 后自动启用阿里云 ACR 推送
      #   ALIYUN_ACR_REGISTRY（主机名，如 crpi-xxx.<地域>.personal.cr.aliyuncs.com）
      #   ALIYUN_ACR_USERNAME / ALIYUN_ACR_PASSWORD（ACR 固定密码，非阿里云登录密码）
      # 方案：直接用 buildx 构建并推送 ACR（复用 gha 缓存，构建秒级）——
      # 不走"pull ghcr → retag → push"，规避 runner 侧 manifest 兼容性问题
      # 配置步骤见 docs/ALIYUN_ACR_SETUP.md
      - name: Login to Aliyun ACR
        if: ${{ env.ALIYUN_ACR_REGISTRY != '' }}
        # 用 login-action 而非 shell echo：凭据不经 shell 展开，密码含特殊字符也安全
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ALIYUN_ACR_REGISTRY }}
          username: ${{ secrets.ALIYUN_ACR_USERNAME }}
          password: ${{ secrets.ALIYUN_ACR_PASSWORD }}

      - name: Build and push images to Aliyun ACR (classic docker)
        if: ${{ env.ALIYUN_ACR_REGISTRY != '' }}
        continue-on-error: true  # 国内源为尽力而为：跨境链路不稳定，失败不阻塞发布（ghcr 为主源）
        env:
          ACR: ${{ secrets.ALIYUN_ACR_REGISTRY }}
          TAG: ${{ steps.version.outputs.VERSION }}
          ACR_USER: ${{ secrets.ALIYUN_ACR_USERNAME }}
          ACR_PASS: ${{ secrets.ALIYUN_ACR_PASSWORD }}
        run: |
          # 已知限制：GitHub Actions 海外 runner 推阿里云国内 Region（张家口等）需跨境
          # 访问 dockerauth，链路时断时续——对策：
          #   1) 每次推送前重新 docker login（授权会话失效自愈）
          #   2) 5 次指数退避重试（30s/60s/120s/300s）
          #   3) 全部失败仅告警不阻塞发布（ghcr 为主源）；稳定国内源可改 ACR「云上构建」
          acr_login() {
            printf '%s' "$ACR_PASS" | docker login $ACR -u "$ACR_USER" --password-stdin >/dev/null 2>&1
          }
          push_with_retry() {
            image="$1"
            for attempt in 1 2 3 4 5; do
              acr_login
              if OUT=$(docker push "$image" 2>&1); then
                echo "OK: push $image (attempt $attempt)"
                return 0
              fi
              ERR=$(echo "$OUT" | tr '\r' '\n' | grep -iE "error|denied|unauthorized|context canceled|timeout|failed" | tail -3)
              echo "::warning::[push $image 第 ${attempt}/5 次] ${ERR:-未知错误}，稍后重试"
              case $attempt in 1) sleep 30;; 2) sleep 60;; 3) sleep 120;; 4) sleep 300;; esac
            done
            echo "::error::[push $image] 5 次重试均失败（跨境链路不稳定），本次国内源跳过——ghcr 主源不受影响"
            return 1
          }
          docker build -t $ACR/pygbsentry:$TAG --build-arg APP_VERSION=$TAG ./backend
          push_with_retry $ACR/pygbsentry:$TAG
          docker tag $ACR/pygbsentry:$TAG $ACR/pygbsentry:latest
          push_with_retry $ACR/pygbsentry:latest
          docker build -t $ACR/pygbsentry-frontend:$TAG ./frontend
          push_with_retry $ACR/pygbsentry-frontend:$TAG
          docker tag $ACR/pygbsentry-frontend:$TAG $ACR/pygbsentry-frontend:latest
          push_with_retry $ACR/pygbsentry-frontend:latest

      - name: Run Trivy vulnerability scanner on release image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ghcr.io/${{ github.repository }}:${{ steps.version.outputs.VERSION }}
          format: sarif
          output: trivy-release-results.sarif
          severity: CRITICAL,HIGH
          # FIX: 原为 exit-code: '1'，基础镜像 CVE 会永久阻断发布。改为报告模式：
          # 结果仍上传 GitHub Security tab 供审阅，不阻塞 Release（镜像基线升级另行处理）
          exit-code: '0'
        continue-on-error: true  # v1.0.0 不因安全扫描失败阻塞发布；结果在 Security tab 审阅

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        continue-on-error: true
        with:
          sarif_file: trivy-release-results.sarif

      # 构建前端产物并上传为 Release Asset
      - name: Setup Node.js for frontend build
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9

      - name: Build frontend dist
        working-directory: frontend
        # TS 债务专项已清零（2026-11-26），恢复 build:full（含 vue-tsc 类型检查）
        run: |
          pnpm install --frozen-lockfile
          pnpm run build:full

      - name: Package frontend dist
        run: |
          cd frontend/dist
          zip -r ../../pygbsentry-frontend-${{ steps.version.outputs.VERSION }}.zip .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.VERSION }}
          name: Release ${{ steps.version.outputs.VERSION }}
          generate_release_notes: true  # 自动基于 PR/commit 生成 changelog
          draft: false
          prerelease: ${{ contains(steps.version.outputs.VERSION, '-') }}
          files: |
            pygbsentry-frontend-${{ steps.version.outputs.VERSION }}.zip
          body: |
            ## PyGBSentry ${{ steps.version.outputs.VERSION }}

            ### Docker Image
            ```
            docker pull ghcr.io/${{ github.repository }}:${{ steps.version.outputs.VERSION }}
            ```

            ### Frontend Artifact
            下载下方的 `pygbsentry-frontend-${{ steps.version.outputs.VERSION }}.zip` 解压到 nginx 静态目录。

            ### 升级指南
            请参考 [docs/INSTALL.md](https://github.com/${{ github.repository }}/blob/main/docs/INSTALL.md) 与 [docs/UPGRADE_ACTION_PLAN.md](https://github.com/${{ github.repository }}/blob/main/docs/UPGRADE_ACTION_PLAN.md)。

            ### 安全提示
            - 首次启动前必须修改 `SECRET_KEY`、`MEDIA_SERVER_SECRET`、`DATABASE_PASSWORD`、`REDIS_PASSWORD` 等敏感配置
            - 生产环境必须设置 `APP_ENV=prod` 并启用 `INIT_REDIS_ON_STARTUP=true`
            - 建议运行 `python tools/scan_config_security.py --strict` 验证配置安全

            ---
            *本 Release 由 GitHub Actions 自动生成*
