name: Open-source backend CI

on:
  pull_request:
    paths:
      - "editions/open-source/backend/**"
      - ".github/workflows/open-source-backend-ci.yml"
  push:
    branches: [main]
    paths:
      - "editions/open-source/backend/**"
      - ".github/workflows/open-source-backend-ci.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: editions/open-source/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"  # FIX [2026-07-17]: 与 Dockerfile python:3.12-slim 对齐
          cache: "pip"
          cache-dependency-path: editions/open-source/backend/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov pytest-mock httpx
      - name: Run tests
        env:
          DATABASE_TYPE: sqlite
          APP_ENV: test
          SECRET_KEY: test-secret-key-for-ci
        run: |
          python -m pytest tests/ -v --tb=short --cov=app --cov-report=term-missing --cov-fail-under=22
