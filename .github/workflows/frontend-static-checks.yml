            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat "$status_file" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            reason=$(grep -o '"reason_code":[[:space:]]*"[^"]*"' "$status_file" | head -n1 | sed 's/.*"reason_code":[[:space:]]*"\([^"]*\)".*/\1/')
