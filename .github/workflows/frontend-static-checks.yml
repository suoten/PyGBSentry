name: Frontend static checks

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "editions/open-source/frontend/**"
      - "editions/open-source/mobile/**"
      - "editions/server/frontend/**"
      - ".github/workflows/frontend-static-checks.yml"
  push:
    branches: [main]
    paths:
      - "editions/open-source/frontend/**"
      - "editions/open-source/mobile/**"
      - "editions/server/frontend/**"
      - ".github/workflows/frontend-static-checks.yml"

jobs:
  open-source-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: editions/open-source/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      # 统一使用 pnpm（与 ci.yml / CONTRIBUTING.md / pnpm-lock.yaml 一致）。
      # 此前使用 npm ci 但仓库无 package-lock.json，CI 必然失败。
      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9
      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT
        id: pnpm-cache
      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.os == 'Linux' && env.STORE_PATH || '~/.pnpm-store' }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Mirror / TS-JS conflict check
        run: pnpm run check:no-js-mirrors
      - name: No raw axios response.data.detail
        run: pnpm run check:no-raw-axios-detail
      - name: Typecheck (vue-tsc, incremental)
        run: pnpm run typecheck:ci

  server-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: editions/server/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: editions/server/frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: No raw axios response.data.detail
        run: npm run check:no-raw-axios-detail
      - name: Typecheck (vue-tsc)
        run: npm run typecheck

  open-source-mobile:
    runs-on: ubuntu-latest
    env:
      MOBILE_REGRESSION_REQUIRED: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      MOBILE_REGRESSION_REPORT_PATH: "scripts/mobile-regression-report.json"
      MOBILE_REGRESSION_FETCH_STATUS_PATH: "scripts/mobile-regression.fetch-status.json"
      MOBILE_REGRESSION_REPORT_API_URL: ${{ secrets.MOBILE_REGRESSION_REPORT_API_URL }}
      MOBILE_REGRESSION_REPORT_API_TOKEN: ${{ secrets.MOBILE_REGRESSION_REPORT_API_TOKEN }}
      MOBILE_REGRESSION_REPORT_API_TOKEN_EXPIRES_AT: ${{ vars.MOBILE_REGRESSION_REPORT_API_TOKEN_EXPIRES_AT }}
      MOBILE_REGRESSION_REPORT_API_TOKEN_EXPIRES_SOON_SEC: "86400"
      MOBILE_REGRESSION_REPORT_API_TOKEN_MIN_LENGTH: "20"
      MOBILE_REGRESSION_REPORT_API_TOKEN_SOURCE: "secrets"
      MOBILE_REGRESSION_REPORT_API_TOKEN_SOURCE_ALLOWED: ${{ vars.MOBILE_REGRESSION_REPORT_API_TOKEN_SOURCE_ALLOWED || 'secrets' }}
      MOBILE_REGRESSION_REPORT_API_TOKEN_SCOPES: ${{ vars.MOBILE_REGRESSION_REPORT_API_TOKEN_SCOPES }}
      MOBILE_REGRESSION_REPORT_API_TOKEN_REQUIRED_SCOPES: ${{ vars.MOBILE_REGRESSION_REPORT_API_TOKEN_REQUIRED_SCOPES || 'mobile-regression.read' }}
      MOBILE_REGRESSION_REPORT_API_TOKEN_FORBIDDEN_SCOPES: ${{ vars.MOBILE_REGRESSION_REPORT_API_TOKEN_FORBIDDEN_SCOPES || 'admin,write:*' }}
      MOBILE_REGRESSION_REPORT_API_TOKEN_ENFORCE_MIN_PRIVILEGE: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      MOBILE_REGRESSION_REPORT_TOKEN_MIN_TTL_SEC: "604800"
      MOBILE_REGRESSION_POLICY_ENV: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'prod' || 'canary' }}
      MOBILE_REGRESSION_POLICY_REQUIRED: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
