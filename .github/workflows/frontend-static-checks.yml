name: Frontend static checks

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-static-checks.yml"
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-static-checks.yml"

jobs:
  open-source-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      # 统一使用 pnpm（与 ci.yml / CONTRIBUTING.md / pnpm-lock.yaml 一致）。
      # 此前使用 npm ci 但仓库无 package-lock.json，CI 必然失败。
      # 版本从 package.json 的 packageManager 字段读取，避免双重指定冲突。
      - name: Install pnpm
        uses: pnpm/action-setup@v2
      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT
        id: pnpm-cache
      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.os == 'Linux' && env.STORE_PATH || '~/.pnpm-store' }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Mirror / TS-JS conflict check
        run: pnpm run check:no-js-mirrors
      - name: No raw axios response.data.detail
        run: pnpm run check:no-raw-axios-detail
      - name: Typecheck (vue-tsc, incremental)
        run: pnpm run typecheck:ci
