      - name: Mobile regression fetch summary
        if: always()
        shell: bash
        run: |
          status_file="scripts/mobile-regression.fetch-status.json"
          echo "### Mobile Regression Report Fetch" >> "$GITHUB_STEP_SUMMARY"
          if [ -f "$status_file" ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat "$status_file" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            reason=$(grep -o '"reason_code":[[:space:]]*"[^"]*"' "$status_file" | head -n1 | sed 's/.*"reason_code":[[:space:]]*"\([^"]*\)".*/\1/')
            degraded=$(grep -o '"degraded":[[:space:]]*[^,}]*' "$status_file" | head -n1 | sed 's/.*"degraded":[[:space:]]*\([^,}]*\).*/\1/')
            if [ "$reason" != "OK" ] && [ -n "$reason" ]; then
              echo "::warning::mobile regression report fetch reason=$reason"
            fi
            if [ "$degraded" = "true" ]; then
              echo "::warning::mobile regression report fetch degraded=true reason=$reason"
            fi
          else
            echo "- status file missing: $status_file" >> "$GITHUB_STEP_SUMMARY"
          fi
